services:
  backend:
    build: .
    ports:
      - "8000:8000"
    volumes:
      - .:/app
    environment:
      - DEBUG=1
      - DJANGO_SETTINGS_MODULE=checkers_api.settings
      - REDIS_URL=redis://redis:6379/0
      - AI_PROVIDER_STR=${AI_PROVIDER_STR:-groq:llama-3.1-8b-instant}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
    depends_on:
      - redis

  worker:
    build: .
    command: python manage.py rqworker default
    volumes:
      - .:/app
    environment:
      - DEBUG=1
      - DJANGO_SETTINGS_MODULE=checkers_api.settings
      - PYTHONPATH=/app
      - REDIS_URL=redis://redis:6379/0
      - AI_PROVIDER_STR=${AI_PROVIDER_STR:-groq:}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - GROQ_API_KEY=${GROQ_API_KEY:-}
      - HTTP_PROXY=
      - HTTPS_PROXY=
      - ALL_PROXY=
      - NO_PROXY=*
    depends_on:
      - redis

  frontend:
    build: ../REACTive-checkers
    ports:
      - "5173:5173"
    volumes:
      - ../REACTive-checkers:/app
      - /app/node_modules
    environment:
      - CHOKIDAR_USEPOLLING=true
    depends_on:
      - backend

  redis:
    image: redis:latest
    ports:
      - "6379:6379"

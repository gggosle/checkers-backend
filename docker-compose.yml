services:
  backend:
    build: ./checkers-backend
    ports:
      - "8000:8000"
    volumes:
      - ./checkers-backend:/app
    environment:
      - DEBUG=1

  frontend:
    build: ./REACTive-checkers
    ports:
      - "5173:5173"
    volumes:
      - ./REACTive-checkers:/app
      - /app/node_modules
    environment:
      - CHOKIDAR_USEPOLLING=true
    depends_on: backend
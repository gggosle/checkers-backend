name: Python CI Pipeline

on:
  push:
    branches: [ "#1-develop-initial-working-api", "main"]
  pull_request:
    branches: [ "main" ]

jobs:
  quality-and-security:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install flake8 safety bandit
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

    - name: 1. Linting check (Flake8)
      run: |
        flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
        flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

    - name: 2. Dependency Security Scan (Safety)
      run: |
        safety check

    - name: 3. Static Application Security Testing (Bandit)
      run: |
        bandit -r . -x ./tests

    - name: 4. Unit and Integration Tests (Django)
      run: |
        python manage.py test